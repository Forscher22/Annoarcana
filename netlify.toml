[build]
  command = "npm run build"
  publish = "_site"

# Lets the deploy-succeeded function see which migrations shipped with a deploy
[functions.deploy-succeeded]
  included_files = ["netlify/database/migrations/**"]

# The Elves lore interlude is page 31; it used to live at 30a/30b
[[redirects]]
  from = "/comic/30a"
  to = "/comic/31/"
  status = 301
  force = true

[[redirects]]
  from = "/comic/30b"
  to = "/comic/31a/"
  status = 301
  force = true

# Resized images (eleventy-img) and share images have content-hashed names, so
# a changed image always gets a new URL and these can be cached for a year
[[headers]]
  for = "/img/r/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/share/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic hardening for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Reuse resized images from earlier builds (see netlify/plugins/image-cache)
[[plugins]]
  package = "./netlify/plugins/image-cache"
